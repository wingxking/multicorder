[workspace]
resolver = "2"
members = [
  "crates/mc-core",
  "crates/mc-store",
  "crates/mc-audio",
  "crates/mc-recorder",
  "crates/mc-vad",
  "crates/mc-capture-macos",
  "crates/mc-asr",
  "crates/mc-insight",
  "crates/mc-engine",
  "crates/mc-local-api",
  "apps/mcd",
  "apps/host",
  "apps/desktop/src-tauri",

]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
mc-core = { path = "crates/mc-core" }
mc-store = { path = "crates/mc-store" }
mc-audio = { path = "crates/mc-audio" }
mc-recorder = { path = "crates/mc-recorder" }
mc-vad = { path = "crates/mc-vad" }
mc-capture-macos = { path = "crates/mc-capture-macos" }
mc-asr = { path = "crates/mc-asr" }
mc-insight = { path = "crates/mc-insight" }
mc-engine = { path = "crates/mc-engine" }
mc-local-api = { path = "crates/mc-local-api" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rubato = "0.16"
flacenc = "0.4"
claxon = "0.4"
hound = "3.5"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
dirs = "5"
libc = "0.2"
ringbuf = "0.4"
plist = "1"
cidre = { git = "https://github.com/yury/cidre", rev = "7e93f2ca45138f61c6495aa0767c1643fdc85c4f", default-features = false, features = ["core_audio", "av", "blocks", "dispatch", "macos_14_4"] }

[profile.dev.package."*"]
opt-level = 2
